<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>整發處 IRBD 島</title>
<style>
/* 單一視覺世界：聖誕雪景黏土微縮群島（固定淺色） */
:root{
  --teal:#0EB4B8; --teal-ink:#0a7f82; --orange:#F08C3A; --ink:#211d1d; --cream:#fff8f4;
  --yellow:#fcea8b; --muted:#6b5f58; --glass:rgba(255,250,245,.8);
  --ok:#2f8a4a; --ok-bg:#e3f4e7; --deck:#3f5fa8; --deck-bg:#e5ebf8; --tbd:#7a7a7a; --tbd-bg:#ececec; --cf:#9a6a00; --cf-bg:#fdf1c8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fbfdff 0%,#d9e4ee 100%);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
#lead{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}

.isl-label{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:999px;background:var(--cream);
  box-shadow:0 2px 10px #4a2a1428,0 0 0 1px #4a2a140f;font-size:13.5px;font-weight:800;white-space:nowrap;transition:opacity .25s,background .25s,color .25s}
.isl-label .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}
.isl-label small{font-size:10.5px;font-weight:600;color:var(--muted)}
.isl-label.sel{background:var(--ink);color:var(--cream)} .isl-label.sel small{color:#d9cfc8}
.isl-label.dim{opacity:.45}
.isl-label.small{font-size:11.5px;padding:4px 10px 4px 5px}
.pin{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;background:#fff;font-size:11.5px;font-weight:700;
  box-shadow:0 2px 8px #4a2a1430;white-space:nowrap;transform:translateY(-10px)}
.pin b{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:10.5px}
.pin.on{background:var(--ink);color:var(--cream)}
.pin.lk b{background:#c9a84a}

#brand{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));max-width:min(380px,calc(100vw - 32px));
  padding:14px 18px 15px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 1px 0 #fff inset,0 10px 30px #4a2a1418,0 2px 6px #4a2a1410}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:2px;color:var(--teal-ink);text-transform:uppercase}
#brand h1{margin:6px 0 3px;font-size:21px;line-height:1.25;text-wrap:balance}
#brand h1 em{font-style:normal;color:var(--teal)}
#brand .sub{font-size:12px;color:var(--muted);line-height:1.55}

#toolbar{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(var(--brandH,120px) + 24px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:5px;border-radius:14px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 20px #4a2a1416}
.tbtn,.hbtn{min-height:44px;min-width:46px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 9px;cursor:pointer}
.tbtn i,.hbtn i{font-style:normal;font-size:15px;line-height:1}
.tbtn:hover,.hbtn:hover{background:var(--yellow)}
.tbtn[aria-pressed="true"],.hbtn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.tbtn:focus-visible,.hbtn:focus-visible,.row:focus-visible,.chip:focus-visible,#search:focus-visible,.x:focus-visible,.side-tab:focus-visible{outline:3px solid var(--teal);outline-offset:1px}

#hud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px #4a2a141c,0 2px 6px #4a2a1410}
#clock{display:flex;flex-direction:column;align-items:center;min-width:74px;padding:0 10px}
#clock b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
#clock span{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.sep{width:1px;height:28px;background:#4a2a141f;margin:0 2px}

/* 浮動數字卡 */
#fcard{position:absolute;left:0;top:0;width:330px;max-height:min(520px,calc(100% - 140px));display:flex;flex-direction:column;background:#fffdfb;border-radius:20px;
  box-shadow:0 1px 0 #fff inset,0 2px 4px #4a2a140d,0 12px 28px #4a2a141c,0 30px 60px #4a2a1414;overflow:hidden;z-index:6}
#fcard .grab{display:none}
#fcard .x{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:9px;background:transparent;font-size:21px;color:var(--muted);cursor:pointer}
#fcard .x:hover{background:var(--yellow);color:var(--ink)}
#fbody{overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:11px;overscroll-behavior:contain}
.c-top{display:flex;align-items:center;gap:8px;padding-right:34px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.actual{color:var(--ok);background:var(--ok-bg)} .tag.deck{color:var(--deck);background:var(--deck-bg)}
.tag.tbd{color:var(--tbd);background:var(--tbd-bg)} .tag.confirm{color:var(--cf);background:var(--cf-bg)}
.c-title{margin:0;font-size:18px;line-height:1.3;text-wrap:balance}
.c-owner{font-size:12.5px;color:var(--muted);margin-top:-6px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.num{background:var(--cream);border-radius:14px;padding:9px 10px;box-shadow:inset 0 0 0 1px #4a2a140f;min-width:0}
.num b{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:22px;line-height:1.05;color:var(--teal-ink);font-variant-numeric:tabular-nums;word-break:break-word}
.num b small{font-size:12px;font-style:normal;font-family:var(--font);color:var(--ink);margin-left:2px}
.num.tbd b{color:#9a9a9a}
.num span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.read{margin:0;font-size:14px;line-height:1.65;border-left:3px solid var(--teal);padding-left:10px}
.extra{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;color:#3a3230}
.src{font-size:11px;color:var(--muted);line-height:1.5}
.mark-tbd{color:var(--tbd);font-weight:700} .mark-cf{color:var(--cf);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;font:inherit;font-size:12px;font-weight:600;border-radius:999px;background:#fff;color:var(--ink);padding:7px 12px;min-height:32px;box-shadow:0 2px 8px #4a2a1414;cursor:pointer}
.chip:hover{background:var(--yellow)}

/* 右側清單 */
#side{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;
  display:flex;flex-direction:column;border-radius:20px;background:rgba(255,250,245,.76);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 10px 30px #4a2a141c,0 2px 6px #4a2a1410;overflow:hidden;z-index:4}
#side .grab{display:none}
.side-head{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
#search{min-height:44px;border:0;border-radius:12px;background:#fff;padding:0 14px;font:inherit;font-size:14px;color:var(--ink);box-shadow:inset 0 0 0 1px #4a2a141a}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#efe4da;border-radius:11px;padding:3px}
.side-tab{min-height:38px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.side-tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #4a2a1418}
#sideBody{flex:1;overflow-y:auto;padding:2px 10px 14px;overscroll-behavior:contain}
.grp{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;margin:14px 6px 6px}
.grp i{width:12px;height:12px;border-radius:4px}
.grp button{margin-left:auto;border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:700;color:var(--teal-ink);cursor:pointer;min-height:30px;border-radius:8px;padding:0 6px}
.grp button:hover{background:#fff}
.row{display:flex;align-items:center;gap:9px;width:100%;min-height:40px;border:0;background:transparent;border-radius:10px;padding:5px 8px;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:var(--ink)}
.row:hover{background:var(--yellow)}
.row .t{flex:1;min-width:0}
.row .t small{display:block;font-size:11px;color:var(--muted)}
.row .d{width:8px;height:8px;border-radius:50%;flex:none}
.row.on{box-shadow:inset 0 0 0 2px var(--teal);background:#fff}
.empty{font-size:13px;color:var(--muted);padding:16px 8px}

#legend{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;padding:7px 14px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 14px #4a2a1414;font-size:11.5px;font-weight:600;white-space:nowrap}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{width:10px;height:10px;border-radius:3px}

#help{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#2a1c1433;padding:16px}
#help .box{width:min(480px,100%);background:#fffdfb;border-radius:22px;padding:22px 22px 18px;box-shadow:0 30px 60px #4a2a1430}
#help h2{margin:6px 0 14px;font-size:20px}
#help ol{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
#help li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6}
#help li b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px}
#help .ok{min-height:44px;width:100%;border:0;border-radius:12px;background:var(--ink);color:var(--cream);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#help .ok:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 40%,#fbfdff,#d9e4ee);z-index:50;transition:opacity .6s}
#loading .big{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:.04em}
#loading .big em{font-style:normal;color:var(--teal)}
#loading .msg{font-size:14px;color:var(--muted)}
#loading .err{max-width:min(520px,calc(100vw - 32px));font-size:13px;color:#a3341f;background:#fff;border-radius:12px;padding:12px 14px;line-height:1.6}
#loading.done{opacity:0;pointer-events:none}
#btnTime{display:none}

@media (prefers-reduced-motion: reduce){ #loading,.isl-label{transition:none} }
@media (max-width:800px){
  #brand{padding:10px 14px;border-radius:16px;max-width:calc(100vw - 32px)}
  #brand h1{font-size:16px} #brand .sub{display:none}
  #toolbar{flex-direction:column}
  #btnTime{display:flex}
  #fcard,#side{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:none;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #fcard{height:40%;z-index:9} #side{height:52%;z-index:8}
  #fcard.full,#side.full{height:calc(100% - 8px - env(safe-area-inset-top,0px))}
  #fcard .grab,#side .grab{display:block;flex:none;height:26px;cursor:grab;touch-action:none;position:relative}
  #fcard .grab::after,#side .grab::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;border-radius:3px;background:#4a2a1438;transform:translateX(-50%)}
  #fcard .x{top:2px}
  #lead{display:none}
  #hud{display:none;flex-wrap:wrap;justify-content:center;width:calc(100vw - 32px);border-radius:20px;z-index:12}
  #hud.open{display:flex} #hud .sep{display:none}
  #clock{width:100%;flex-direction:row;justify-content:center;gap:8px;padding:4px 0}
  #legend{bottom:calc(14px + env(safe-area-inset-bottom,0px));white-space:normal;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
  #side:not([hidden]) ~ #legend,#fcard:not([hidden]) ~ #legend{display:none}
}
</style>

    if(!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const targets = [...Object.values(kit.meshes).filter(m => m.visible), ...dynPick, ...linkHits, ...islandTopMeshes];
    const hits = raycaster.intersectObjects(targets, true);
    for(const h of hits){
      const o = h.object;
      if(o.userData.link) return selectLink(o.userData.link);
      if(o.userData.pick) return selectObject(o.userData.pick);
      if(o.userData.pickIds){ const id = o.userData.pickIds[h.instanceId]; if(id) return id.startsWith('L_') ? selectLink(id) : selectObject(id); }
      if(o.userData.owners){ const id = o.userData.owners[h.instanceId]; if(id) return id.startsWith('L_') ? selectLink(id) : selectObject(id); }
      if(islandTopMeshes.includes(o)){ const t = Object.values(tiles).sort((a,b) => a.pos.distanceTo(h.point) - b.pos.distanceTo(h.point))[0]; return selectIsland(t.island); }
    }
    deselect();
  });

  // 右側清單
  const side = $('#side'), sideBody = $('#sideBody'), search = $('#search');
  let tab = 'obj';
  const TAGDOT = { actual:'var(--ok)', deck:'var(--deck)', tbd:'#9a9a9a', confirm:'#d9a400' };
  function renderSide(){
    const q = search.value.trim().toLowerCase();
    const hit = (...xs) => !q || xs.join(' ').toLowerCase().includes(q);
    let html = '';
    DATA.islands.forEach(isl => {
      const rows = tab === 'obj'
        ? DATA.objects.filter(o => o.island === isl.id).concat(isl.id === 'strategy' ? [ROAMER] : []).filter(o => hit(o.name, o.role, o.card.owner, o.card.read))
            .map(o => `<button class="row" data-obj="${o.id}" style="${o.part ? 'padding-left:22px' : ''}"><i class="d" style="background:${TAGDOT[o.card.tag]}"></i><span class="t">${esc(o.name)}<small>${esc(o.role)}</small></span></button>`)
        : DATA.links.filter(L => islandOfLink(L) === isl.id).filter(L => hit(L.name, L.owners, L.card.read))
            .map(L => `<button class="row" data-link="${L.id}"><i class="d" style="background:${TAGDOT[L.card.tag]}"></i><span class="t">${esc(L.name)}<small>${esc(L.owners)}</small></span></button>`);
      if(rows.length) html += `<div class="grp"><i style="background:${isl.color}"></i>${esc(isl.name)}<button data-island="${isl.id}">前往</button></div>` + rows.join('');
    });
    sideBody.innerHTML = html || '<div class="empty">找不到符合的項目，換個關鍵字試試。</div>';
    sideBody.querySelectorAll('[data-obj]').forEach(b => b.addEventListener('click', () => selectObject(b.dataset.obj)));
    sideBody.querySelectorAll('[data-link]').forEach(b => b.addEventListener('click', () => selectLink(b.dataset.link)));
    sideBody.querySelectorAll('[data-island]').forEach(b => b.addEventListener('click', () => selectIsland(b.dataset.island)));
    markSide();
  }
  function markSide(){ sideBody.querySelectorAll('.row').forEach(b => b.classList.toggle('on', (b.dataset.obj || b.dataset.link) === sel.id)); }
  search.addEventListener('input', renderSide);
  document.querySelectorAll('.side-tab').forEach(t => t.addEventListener('click', () => { tab = t.dataset.tab; document.querySelectorAll('.side-tab').forEach(x => x.setAttribute('aria-selected', x === t)); renderSide(); }));
  renderSide();

  // 工具列與 HUD
  const state = { minutes:990, playing:false, reduced: matchMedia('(prefers-reduced-motion: reduce)').matches };
  const btnList = $('#btnList');
  function setSide(open){ side.hidden = !open; btnList.setAttribute('aria-pressed', open); }
  btnList.addEventListener('click', () => { setSide(side.hidden); if(!isDesktop() && !side.hidden) deselect(); });
  function overviewDistance(){
    const W = app.clientWidth, a = W/Math.max(1, app.clientHeight);
    const free = isDesktop() && !side.hidden ? side.getBoundingClientRect().left / W : 1;
    const half = (box3.max.x - box3.min.x)/2 + 6.5;
    return clamp(half / (Math.tan(THREE.MathUtils.degToRad(16)) * a * free), 52, 125);
  }
  function goOverview(instant){ const t = center.clone().setY(TOP*.5); const off = OVERVIEW_DIR.clone().multiplyScalar(overviewDistance());
    if(instant){ const s0 = state.reduced; state.reduced = true; flyTo(t, off); state.reduced = s0; } else flyTo(t, off); }
  $('#btnHome').addEventListener('click', () => { deselect(); setBird(false); goOverview(); });
  const helpEl = $('#help');
  const openHelp = () => { helpEl.hidden = false; helpEl.querySelector('.ok').focus(); };
  const closeHelp = () => { helpEl.hidden = true; try { localStorage.setItem('irbd2-help', '1'); } catch(e){} };
  $('#btnHelp').addEventListener('click', openHelp); helpEl.querySelector('.ok').addEventListener('click', closeHelp); helpEl.addEventListener('click', e => { if(e.target === helpEl) closeHelp(); });
  const clockTime = $('#clockTime'), clockLabel = $('#clockLabel');
  const PERIOD = m => m < 360 ? '深夜' : m < 540 ? '清晨' : m < 900 ? '白天' : m < 1080 ? '斜陽' : m < 1200 ? '黃昏' : '夜晚';
  let lastMin = -1;
  function updateClock(){ const m = Math.floor(state.minutes); if(m === lastMin) return; lastMin = m;
    clockTime.textContent = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); clockLabel.textContent = PERIOD(m); }
  document.querySelectorAll('[data-time]').forEach(b => b.addEventListener('click', () => { state.minutes = +b.dataset.time; applyTime(state.minutes); updateClock(); }));
  const btnPlay = $('#btnPlay');
  btnPlay.addEventListener('click', () => { state.playing = !state.playing; btnPlay.setAttribute('aria-pressed', state.playing); btnPlay.querySelector('i').textContent = state.playing ? '❚❚' : '▶'; });
  const btnLinks = $('#btnLinks');
  btnLinks.addEventListener('click', () => { const on = btnLinks.getAttribute('aria-pressed') !== 'true'; btnLinks.setAttribute('aria-pressed', on);
    tab = on ? 'link' : 'obj'; document.querySelectorAll('.side-tab').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab)); setSide(true); renderSide();
    linkHits.forEach(h => { h.material = on ? linkGlowMat : hitMat; h.visible = true; }); });
  const linkGlowMat = new THREE.MeshBasicMaterial({ color:'#0EB4B8', transparent:true, opacity:.22, depthWrite:false });
  const btnBird = $('#btnBird'); let bird = false;
  function setBird(on){ bird = on; btnBird.setAttribute('aria-pressed', on); controls.minPolarAngle = on ? 0 : THREE.MathUtils.degToRad(25); }
  btnBird.addEventListener('click', () => { if(bird){ setBird(false); flyTo(controls.target.clone(), OVERVIEW_DIR.clone().multiplyScalar(overviewDistance())); } else { setBird(true); flyTo(controls.target.clone(), new THREE.Vector3(.01, 70, 8)); } });
  const hudEl = $('#hud'), btnTime = $('#btnTime');
  btnTime.addEventListener('click', () => { const on = !hudEl.classList.contains('open'); hudEl.classList.toggle('open', on); btnTime.setAttribute('aria-pressed', on); });

  // 鍵盤
  const sph = new THREE.Spherical();
  window.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ if(!helpEl.hidden) closeHelp(); else deselect(); return; }
    if(e.target.closest && e.target.closest('input')) return;
    const d = { ArrowLeft:[-.09,0], ArrowRight:[.09,0], ArrowUp:[0,-.07], ArrowDown:[0,.07] }[e.key]; if(!d) return;
    e.preventDefault(); fly.active = false;
    const off = camera.position.clone().sub(controls.target); sph.setFromVector3(off); sph.theta += d[0]; sph.phi = clamp(sph.phi + d[1], controls.minPolarAngle, controls.maxPolarAngle);
    camera.position.copy(controls.target).add(off.setFromSpherical(sph)); controls.update();
  });

  // 手機 bottom sheet 拖曳
  function sheet(el, onClose){ const g = el.querySelector('.grab'); let y0 = null, h0 = 0, moved = 0;
    g.addEventListener('pointerdown', e => { if(isDesktop()) return; y0 = e.clientY; h0 = el.getBoundingClientRect().height; moved = 0; g.setPointerCapture(e.pointerId); });
    g.addEventListener('pointermove', e => { if(y0 == null) return; moved = Math.max(moved, Math.abs(e.clientY - y0)); el.classList.remove('full'); el.style.height = clamp(h0 + y0 - e.clientY, 90, innerHeight - 8) + 'px'; });
    g.addEventListener('pointerup', () => { if(y0 == null) return; y0 = null;
      if(moved < 6){ el.style.height = ''; el.classList.toggle('full'); return; }
      const h = el.getBoundingClientRect().height; if(h > innerHeight*.8){ el.style.height = ''; el.classList.add('full'); } else if(h < innerHeight*.16){ el.style.height = ''; onClose(); } }); }
  sheet(fcard, deselect); sheet(side, () => setSide(false));

  // reduced-motion
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  rmq.addEventListener('change', () => { state.reduced = rmq.matches; });

  // 標籤避讓：與面板重疊時隱藏
  const panels = ['#brand','#toolbar','#side','#hud','#fcard','#legend'].map(s => $(s));
  function avoidLabels(){
    const rects = panels.filter(p => !p.hidden && p.offsetParent !== null).map(p => p.getBoundingClientRect());
    for(const id in islandLabels){ const el = islandLabels[id].el; const r = el.getBoundingClientRect(); if(!r.width) continue;
      const over = rects.some(p => r.left < p.right && r.right > p.left && r.top < p.bottom && r.bottom > p.top);
      el.style.visibility = over ? 'hidden' : ''; }
  }

  /* ---------- 尺寸與迴圈 ---------- */
  function resize(){ const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); labelRenderer.setSize(w, h); camera.aspect = w/Math.max(1,h); camera.updateProjectionMatrix(); $('#lead').setAttribute('viewBox', `0 0 ${w} ${h}`); }
  new ResizeObserver(resize).observe(app); resize(); goOverview(true);
  if(!isDesktop()) setSide(false);
  applyTime(state.minutes); updateClock();
  let helpSeen = false; try { helpSeen = localStorage.getItem('irbd2-help') === '1'; } catch(e){}
  if(!helpSeen) setTimeout(openHelp, 900);

  const clock = new THREE.Clock(); let t = 0, frame = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), .08);
    if(!state.reduced){ t += dt; waterU.uTime.value = t; flowU.uTime.value = t; updateMotion(t, dt); }
    else if(frame === 0) updateMotion(0, 0);
    if(state.playing && !state.reduced){ state.minutes = (state.minutes + dt*10) % 1440; applyTime(state.minutes); updateClock(); }
    stepFly(); controls.update();
    const show = camera.position.distanceTo(controls.target) < 30;
    for(const k in kit.meshes) if(kit.meshes[k].userData.small) kit.meshes[k].visible = show;
    renderer.render(scene, camera); labelRenderer.render(scene, camera);
    placeCard(); if(frame++ % 10 === 0) avoidLabels();
  });

  window.__irbdReady = true;
  window.__irbd = { THREE, scene, camera, controls, renderer, state, meta, linkMeta, selectObject, selectLink, selectIsland, deselect, applyTime, kit };
  requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
} catch(err){
  console.error(err);
  showError(err && err.message ? err.message : String(err));
}
</script>

</body></html>
